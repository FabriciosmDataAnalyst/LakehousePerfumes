# Job rotaperfume_pipeline - pipeline completo de dados da perfumaria.
#
# ESTE JOB GANHA TAREFAS NOS PROXIMOS PROMPTS. Desenho de como vai ficar:
#
#   raw_conferencia   -> confere a chegada dos 10 arquivos no Volume (Deploy 1)
#   + bronze_*        -> le o raw do Volume e grava as tabelas bronze (Deploy 2+)
#   + silver_*        -> valida/limpa e grava silver (Deploy 3+)
#   + gold_*          -> monta visoes finais para dashboard (Deploy 4+)
#
# Agendado diario as 06h (America/Sao_Paulo). O agendamento nasce PAUSED:
# ver databricks.yml (nao usamos mode:development, que prefixaria os schemas com
# [dev <usuario>] e quebraria o SQL; pausamos via presets).

resources:
  jobs:
    rotaperfume_pipeline:
      name: rotaperfume_pipeline
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Sao_Paulo
        pause_status: PAUSED

      tasks:
        - task_key: raw_conferencia
          description: Confere a chegada dos 10 arquivos de raw no Volume e grava a tabela de controle bronze._raw_arquivos.
          notebook_task:
            notebook_path: ../src/raw/conferencia.py
            base_parameters:
              catalog: ${var.catalog}
          # Jobs do Free Edition sao serverless: nao ha compute definida aqui.
          max_retries: 0

        - task_key: bronze_ingestao
          description: Le os 10 CSVs do raw no Volume e grava as tabelas delta da bronze (tudo como texto, mais _ingerido_em e _arquivo_origem).
          notebook_task:
            notebook_path: ../src/bronze/ingestao.py
            base_parameters:
              catalog: ${var.catalog}
          depends_on:
            - task_key: raw_conferencia
          max_retries: 0

        # silver: cada tarefa cuida de um grupo de assuntos. Rodam EM PARALELO
        # entre si (so dependem da bronze); SQL serverless no warehouse do target.
        - task_key: silver_clientes
          description: Limpa e deduplica clientes por CNPJ (3.000 unicos) e declara o contrato da tabela.
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/01-clientes.sql
          depends_on:
            - task_key: bronze_ingestao
          max_retries: 0

        - task_key: silver_pedidos
          description: Normaliza data, tipa valor, cria cancelado/valor_liquido/ano/mes e declara o contrato.
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/02-pedidos.sql
          depends_on:
            - task_key: bronze_ingestao
          max_retries: 0

        - task_key: silver_produtos_itens
          description: Tipa produtos e itens_pedido, sinaliza devolucao/sku_descontinuado e declara o contrato.
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/03-itens-e-produtos.sql
          depends_on:
            - task_key: bronze_ingestao
          max_retries: 0

        - task_key: silver_crm_financeiro
          description: Limpa vendedores, carteira, oportunidades, visitas, pagamentos e estoque; expoe carteiras orfas de vendedor desligado.
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/04-crm-e-financeiro.sql
          depends_on:
            - task_key: bronze_ingestao
          max_retries: 0