# Job rotaperfume_pipeline - pipeline completo de dados da perfumaria.
#
# ESTE JOB GANHA TAREFAS NOS PROXIMOS PROMPTS. Desenho de como vai ficar:
#
#   raw_conferencia   -> confere a chegada dos 10 arquivos no Volume (Deploy 1)
#   + bronze_*        -> le o raw do Volume e grava as tabelas bronze (Deploy 2+)
#   + silver_*        -> valida/limpa e grava silver (Deploy 3+)
#   + gold_*          -> monta visoes finais para dashboard (Deploy 4+)
#
# Agendado diario as 06h (America/Sao_Paulo). O agendamento nasce PAUSED:
# ver databricks.yml (nao usamos mode:development, que prefixaria os schemas com
# [dev <usuario>] e quebraria o SQL; pausamos via presets).

resources:
  jobs:
    rotaperfume_pipeline:
      name: rotaperfume_pipeline
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Sao_Paulo
        pause_status: PAUSED

      tasks:
        - task_key: raw_conferencia
          description: Confere a chegada dos 10 arquivos de raw no Volume e grava a tabela de controle bronze._raw_arquivos.
          notebook_task:
            notebook_path: ../src/raw/conferencia.py
            base_parameters:
              catalog: ${var.catalog}
          # Jobs do Free Edition sao serverless: nao ha compute definida aqui.
          max_retries: 0

        - task_key: bronze_ingestao
          description: Le os 10 CSVs do raw no Volume e grava as tabelas delta da bronze (tudo como texto, mais _ingerido_em e _arquivo_origem).
          notebook_task:
            notebook_path: ../src/bronze/ingestao.py
            base_parameters:
              catalog: ${var.catalog}
          depends_on:
            - task_key: raw_conferencia
          max_retries: 0

        # silver: cada tarefa cuida de um grupo de assuntos. Rodam EM PARALELO
        # entre si (so dependem da bronze); SQL serverless no warehouse do target.
        - task_key: silver_clientes
          description: Limpa e deduplica clientes por CNPJ (3.000 unicos) e declara o contrato da tabela.
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/01-clientes.sql
          depends_on:
            - task_key: bronze_ingestao
          max_retries: 0

        - task_key: silver_pedidos
          description: Normaliza data, tipa valor, cria cancelado/valor_liquido/ano/mes e declara o contrato.
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/02-pedidos.sql
          depends_on:
            - task_key: bronze_ingestao
          max_retries: 0

        - task_key: silver_produtos_itens
          description: Tipa produtos e itens_pedido, sinaliza devolucao/sku_descontinuado e declara o contrato.
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/03-itens-e-produtos.sql
          depends_on:
            - task_key: bronze_ingestao
          max_retries: 0

        - task_key: silver_crm_financeiro
          description: Limpa vendedores, carteira, oportunidades, visitas, pagamentos e estoque; expoe carteiras orfas de vendedor desligado.
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/04-crm-e-financeiro.sql
          depends_on:
            - task_key: bronze_ingestao
          max_retries: 0

        # gold: modelado para consumo. cadeia sequencial - dimensoes -> fato ->
        # marts -> testes. O teste roda POR ULTIMO e e obrigatorio: se falhar,
        # o job para e o dashboard fica com o dado de ontem, nunca com o errado.
        - task_key: gold_dimensoes
          description: Quatro dimensoes conformadas (cliente, produto, vendedor, calendario) para os marts e a analise.
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/05-dimensoes.sql
          depends_on:
            - task_key: silver_clientes
            - task_key: silver_pedidos
            - task_key: silver_produtos_itens
            - task_key: silver_crm_financeiro
          max_retries: 0

        - task_key: gold_fato_vendas
          description: Contrato de vendas, uma linha por item de pedido, devolucao incluida como valor negativo, particionado por ano e mes.
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/06-fato-vendas.sql
          depends_on:
            - task_key: gold_dimensoes
          max_retries: 0

        - task_key: gold_marts
          description: Um mart por diretoria (comercial, produto, financeiro), todos fechando na mesma receita do fato.
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/07-marts.sql
          depends_on:
            - task_key: gold_fato_vendas
          max_retries: 0

        - task_key: testes
          description: Os 9 testes de qualidade que interrompem o job quando alguma transformacao divergir da silver.
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/08-testes.sql
          depends_on:
            - task_key: gold_marts
          max_retries: 0

        # feature: o caminho de volta. A gold ate aqui so nascia do pipeline;
        # retorno_ligacao e a UNICA tabela cujo dado vem da mao do time (o que
        # aconteceu depois da ligacao). Por isso ela usa CREATE TABLE IF NOT
        # EXISTS, nunca CREATE OR REPLACE: o redeploy nao pode apagar o retorno
        # ja registrado. O job vai de 15 para 16 tarefas.
        - task_key: gold_retorno_ligacao
          description: "Declara o contrato de gold.retorno_ligacao (quem ligou, status vendeu/vai_pensar/sem_interesse/nao_atendeu, comentario, de quem registrou e a semana da fila). CREATE TABLE IF NOT EXISTS de proposito: o dado nasce no campo, NUNCA no pipeline."
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/11-retorno-ligacao.sql
          depends_on:
            - task_key: gold_marts
          max_retries: 0

        # feature 06: o que o agente (Genie) vai consumir. Depois dos marts e
        # dos testes rodam, em PARALELO entre si, as views de negocio e a
        # auditoria de metadado (que e o teste que da "dente" a essa entrega).
        - task_key: metricas_de_negocio
          description: As 6 views de negocio (receita_mensal, ranking_marcas, margem_por_categoria, clientes_em_risco, efeito_lancamento, ruptura_por_marca) com nome que a diretoria usa e toda coluna comentada.
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/09-metricas-negocio.sql
          depends_on:
            - task_key: testes
          max_retries: 0

        - task_key: auditoria_de_metadado
          description: Consulta information_schema e QUEBRA o job se houver tabela/view da gold ou coluna de fato_vendas/views de negocio sem COMMENT (metadado faltando e bug). Ao final imprime o relatorio de cobertura.
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/10-auditoria-metadado.sql
          depends_on:
            - task_key: metricas_de_negocio
          max_retries: 0

        # feature 01 da noite de ML: as features para o modelo. Depois dos
        # testes, porque modelo nao se treina com dado que ainda nao passou na
        # qualidade. Nota: features_treino/features_cliente nascem aqui; se a
        # auditoria rodar antes delas no mesmo job, os objetos ainda nao
        # existem — e o COMMENT ON TABLE ja vai gravado quando a tarefa termina.
        - task_key: ml_features
          description: Monta gold.features_treino (corte 2026-08-01 + rotulo comprou_em_7d) e gold.features_cliente (corte 2026-08-31), 20 features por cliente, com a mesma funcao montar_features e a data de corte gravada em _referencia.
          notebook_task:
            notebook_path: ../src/ml/11-features.py
            base_parameters:
              catalog: ${var.catalog}
          depends_on:
            - task_key: testes
          max_retries: 0

        # feature 02 da noite de ML: o modelo. Depois das features. Treina com
        # HistGradientBoosting (nunca XGBoost: quebra no reload do serverless),
        # registra no UC com alias @prod, pontua e grava score_propensao e as
        # metricas como tabelas (o Genie nao le MLflow).
        - task_key: ml_modelo
          description: Treina o modelo de propensao (HistGradientBoosting, seed 42), mede baseline/AUC/lift_top200 out-of-fold, registra no UC (propensao_compra, alias @prod), verifica 3 asserts de qualidade, pontua os clientes em gold.score_propensao e grava gold.modelo_metricas/gold.calibragem_holdout.
          notebook_task:
            notebook_path: ../src/ml/12-modelo.py
            base_parameters:
              catalog: ${var.catalog}
          depends_on:
            - task_key: ml_features
          max_retries: 0

        # feature 03: a fila da semana que o comercial atrasa. Le o score da
        # gold.score_propensao (gerado por ml_modelo) e monta gold.fila_semanal
        # com os 200 top do score entre os elegiveis, uma posicao por vendedor,
        # mais as 4 funcoes de apoio e os 3 testes.
        - task_key: ml_fila
          description: Monta gold.fila_semanal (200 clientes, top do score com carteira vigente e vendedor ativo, posicao por vendedor), as 4 funcoes de apoio (priorizar_carteira, contexto_cliente, sugerir_produtos, checar_disponibilidade) e os 3 testes de qualidade que quebram o job.
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/ml/13-fila.sql
          depends_on:
            - task_key: ml_modelo
          max_retries: 0